name: features

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Library code must not panic: a signer built with `panic = "abort"` halts on one.
  # `src/lib.rs` denies these too; repeating them here keeps the gate if that goes.
  NO_PANIC_LINTS: >-
    -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
    -D clippy::unreachable -D clippy::todo -D clippy::unimplemented
    -D clippy::indexing_slicing -D clippy::string_slice

jobs:
  actions-only:
    name: actions-only build (no client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy
      - name: Build
        run: cargo build --no-default-features --all-targets
      - name: No panics in library code (clippy)
        run: cargo clippy --no-default-features --lib -- $NO_PANIC_LINTS
      - name: No panics in macro bodies (clippy cannot see them)
        run: python3 .github/scripts/no_panic_in_macros.py
      - name: Test
        run: cargo test --no-default-features
      - name: No HTTP, TLS or async runtime in the tree
        run: |
          banned='^(reqwest|hyper|rustls|aws-lc-rs|aws-lc-sys|ring|openssl|openssl-sys|native-tls|tokio)$'
          # A plain assignment takes cargo tree's exit status, so a failing
          # cargo tree fails the step; only grep's no-match exit is tolerated.
          tree=$(cargo tree --no-default-features -e normal --prefix none)
          found=$(printf '%s\n' "$tree" | sed 's/ v.*//' | sort -u | grep -E "$banned" || true)
          if [ -n "$found" ]; then
            echo "actions-only build pulls in:"
            echo "$found"
            exit 1
          fi
      - name: Build for musl
        run: cargo build --no-default-features --lib --target x86_64-unknown-linux-musl

  client:
    name: client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: No panics in library code (clippy)
        run: cargo clippy --all-features --lib -- $NO_PANIC_LINTS
      - name: Test
        run: cargo test --features ws --lib --tests
