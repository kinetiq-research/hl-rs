[package]
name = "hl-rs"
version = "0.1.0"
edition = "2021"
description = "Hyperliquid Rust SDK"
authors = ["mektigboy"]
license = "MIT"
repository = "https://github.com/kinetiq-research/hl-rs"
documentation = "https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/api"
keywords = ["hyperliquid", "hl", "sdk", "rust"]
categories = ["api-bindings"]

[workspace]
members = ["hl-rs-derive"]

[features]
default = ["client"]
# HTTP clients (`ExchangeClient`, `InfoClient`). Without it the crate builds,
# signs and serialises actions with no HTTP, TLS or async runtime in the tree.
client = ["dep:reqwest", "dep:tokio", "dep:tracing"]
custom-signing-chain = []
integration-tests = ["client"]
ws = ["client", "dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
alloy = { version = "1.1.1", default-features = false, features = ["std", "sol-types", "dyn-abi", "signers", "signer-local", "eip712"] }
alloy-signer = { version = "1.1.1", features = ["eip712"] }
chrono = "0.4.42"
dotenv = "0.15.0"
env_logger = "0.11.8"
error-stack = "0.6.0"
k256 = "0.13.4"
lazy_static = "1.5.0"
log = "0.4.28"
reqwest = { version = "0.12.24", features = ["json"], optional = true }
rmp-serde = "1.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread"], optional = true }
tracing = { version = "0.1.43", optional = true }
uuid = { version = "1.18.1", features = ["v4"] }
derive_builder = "0.20.2"
rust_decimal = { version = "1.36.0", features = ["serde"] }
rust_decimal_macros = "1.36.0"
hl-rs-derive = { path = "hl-rs-derive" }

# WebSocket (optional)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", optional = true }

